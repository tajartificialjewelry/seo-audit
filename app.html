<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workspace | SEO Agent</title><meta name="description" content="Your SEO workspace."><meta name="robots" content="noindex"><link rel="stylesheet" href="style.css"></head>
<body><div class="wrap "><div id="nav"></div><main>
<h1 style="font-size:28px">Your SEO workspace</h1><div class="tabs"><button data-tab="optimize">Rank plan</button><button data-tab="audit">Site audit</button><button data-tab="keywords">Keywords</button><button data-tab="gap">Content gap</button><button data-tab="outline">Outline</button><button data-tab="rank">Rank tracker</button></div><section class="panel" id="optimize"><label>Your website URL</label><input id="p_url" placeholder="example.com"><label>Niche (optional, to suggest keywords)</label><input id="p_niche" placeholder="e.g. web design lahore"><button class="go alt" onclick="suggestKw()">Suggest keywords</button><label>Target keywords (one per line)</label><textarea id="p_kw" rows="6" placeholder="web design lahore&#10;website development pakistan"></textarea><button class="go" onclick="optimize()">Build my ranking plan and fixes</button><p class="mute">Finds what to change on every page and writes new titles, descriptions, sitemap, robots.txt and schema. Paste them into your site, then run again to see progress.</p><div class="out" id="p_out"></div></section><section class="panel" id="audit"><label>Website URL</label><input id="a_url" placeholder="example.com"><label>Pages to crawl (max 12)</label><input id="a_lim" type="number" value="12" min="1" max="12" style="width:100px"><br><button class="go" onclick="audit()">Run audit</button><div class="out" id="a_out"></div></section><section class="panel" id="keywords"><label>Niche or seed keyword</label><input id="k_seed" placeholder="e.g. web design lahore"><br><button class="go" onclick="kw()">Find keywords</button><div class="out" id="k_out"></div></section><section class="panel" id="gap"><label>Your website</label><input id="g_url" placeholder="mysite.com"><label>Competitors (one per line, max 3)</label><textarea id="g_comp" rows="3" placeholder="competitor1.com&#10;competitor2.com"></textarea><br><button class="go" onclick="gap()">Find gaps</button><div class="out" id="g_out"></div></section><section class="panel" id="outline"><label>Target keyword</label><input id="o_kw" placeholder="e.g. seo services"><br><button class="go" onclick="outline()">Build article outline</button><div class="out" id="o_out"></div></section><section class="panel" id="rank"><label>Domain</label><input id="r_dom" placeholder="mysite.com"><label>Keywords (one per line, max 5)</label><textarea id="r_kw" rows="4"></textarea><br><button class="go" onclick="rank()">Check rank</button><button class="go alt" onclick="showHist()">View history</button><p class="mute">Positions come from DuckDuckGo results, so treat them as an estimate. 0 means not found in the top results.</p><div class="out" id="r_out"></div></section><div class="ad"></div>
</main><div id="foot"></div></div><script src="config.js"></script><script src="site.js"></script><script src="app.js"></script></body></html>
